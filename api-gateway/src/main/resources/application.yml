server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**,/api/account-types/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**,/api/transfers/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

rikkeibank:
  jwt:
    secret: "rikkeibank-secret-key-minimum-256-bits-for-hs256-algorithm-secure"
